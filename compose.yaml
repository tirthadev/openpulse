
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - openpulse_vendor:/app/vendor
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: openpulse
      DB_USERNAME: openpulse
      DB_PASSWORD: openpulse_dev
      DB_CHARSET: utf8mb4
      REDIS_SCHEME: tcp
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DATABASE: "0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - openpulse_vendor:/app/vendor
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: openpulse
      DB_USERNAME: openpulse
      DB_PASSWORD: openpulse_dev
      DB_CHARSET: utf8mb4
      REDIS_SCHEME: tcp
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DATABASE: "0"
    profiles:
      - tools
    entrypoint: ["php", "bin/openpulse"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: openpulse
      MYSQL_USER: openpulse
      MYSQL_PASSWORD: openpulse_dev
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - openpulse_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "--silent"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  openpulse_vendor:
  openpulse_mysql_data:
