server {
    listen 80;
    server_name openpulse.localhost;

    return 301 https://openpulse.localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name openpulse.localhost;

    ssl_certificate /etc/nginx/certs/openpulse.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/openpulse.localhost-key.pem;

    root /app/public;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_pass app:9000;
    }

    location ~ /\. {
        deny all;
    }
}