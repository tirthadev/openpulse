name: OpenPulse Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openpulse-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OpenPulse to GCP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Inspect deployer OS Login profile
        run: |
          gcloud compute os-login describe-profile \
            --format="yaml(posixAccounts,sshPublicKeys)"

      - name: Verify VM status
        run: |
          STATUS="$(gcloud compute instances describe \
            "${{ vars.GCP_VM_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_VM_ZONE }}" \
            --format="value(status)")"

          echo "VM status: $STATUS"
          test "$STATUS" = "RUNNING"

      - name: Deploy through IAP
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_VM_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo /usr/local/sbin/openpulse-deploy"

      - name: Verify application health through IAP
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_VM_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command="curl --fail --show-error http://localhost:8080/health"
